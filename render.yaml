services:
  # MySQL Private Database Service
  - type: pserv
    name: ghost-db
    runtime: image
    image: mysql:8.0
    plan: starter
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: ghost
      - key: MYSQL_USER
        value: ghost
      - key: MYSQL_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # Ghost Web Service
  - type: web
    name: ghost-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /
    disk:
      name: ghost-content
      mountPath: /var/lib/ghost/content
      sizeGB: 10
    envVars:
      - key: PORT
        value: 2368
      - key: url
        value: https://yourdomain.onrender.com # User replaces this with their live URL
      - key: database__client
        value: mysql
      - key: database__connection__host
        value: ghost-db
      - key: database__connection__port
        value: "3306"
      - key: database__connection__database
        value: ghost
      - key: database__connection__user
        value: ghost
      - key: database__connection__password
        fromService:
          type: pserv
          name: ghost-db
          envVarKey: MYSQL_PASSWORD
      - key: NODE_ENV
        value: production
