version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ghost
    networks:
      - blog_network

  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    expose:
      - "2368"
    volumes:
      - ghost_content:/var/lib/ghost/content
      - ./ghost/themes/nightfall:/var/lib/ghost/content/themes/nightfall:ro
    environment:
      url: ${SITE_URL:-https://yourdomain.com}
      database__client: mysql
      database__connection__host: db
      database__connection__port: 3306
      database__connection__database: ghost
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD:-change_me_ghost_password_here}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blog_network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password_here}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_ghost_password_here}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me_root_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - blog_network

volumes:
  caddy_data:
  caddy_config:
  ghost_content:
  mysql_data:

networks:
  blog_network:
    driver: bridge
