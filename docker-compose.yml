services:
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ghost:
        condition: service_healthy
    networks:
      - frontend_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    expose:
      - "2368"
    ports:
      - "127.0.0.1:2368:2368"
    volumes:
      - ghost_content:/var/lib/ghost/content
      - ./ghost/themes/neonlust:/var/lib/ghost/content/themes/neonlust
    environment:
      url: ${SITE_URL:-https://yourdomain.com}
      database__client: mysql
      database__connection__host: ${MYSQL_HOST:-db}
      database__connection__port: 3306
      database__connection__database: ${MYSQL_DATABASE:-ghost}
      database__connection__user: ${MYSQL_USER:-ghost}
      database__connection__password: ${MYSQL_PASSWORD}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_network
      - backend_network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 2368" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
      MYSQL_USER: ${MYSQL_USER:-ghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - ghost_content:/backup/ghost_content:ro
      - ./backups:/backups
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_USER: ${MYSQL_USER:-ghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache mariadb-client dcron tar
        mkdir -p /etc/periodic/daily /backups
        cat > /etc/periodic/daily/backup << 'EOF'
        #!/bin/sh
        echo "Starting daily backup..."
        mariadb-dump -h "$$MYSQL_HOST" -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" | gzip > /backups/db_backup_$(date +%F).sql.gz
        tar -czf /backups/ghost_content_$(date +%F).tar.gz -C /backup/ghost_content .
        find /backups -maxdepth 1 -mtime +7 -type f \( -name "db_backup_*" -o -name "ghost_content_*" \) -delete
        echo "Backup complete."
        EOF
        chmod +x /etc/periodic/daily/backup
        crond -f -l 2
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  ghost_content:
  mysql_data:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
